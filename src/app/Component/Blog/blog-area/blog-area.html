<section class="blog-section pt-100 pb-100">
    <div class="container">
        <div class="section-title">
            <h2>Our <span>Latest</span> News</h2>
            <div class="bar"></div>
        </div>

        <div class="row">
            <!-- Dynamic Blog Items -->
            <div class="col-lg-4 col-md-6" *ngFor="let blog of blogs">
                <div class="single-blog">
                    <div class="image">
                        <a [routerLink]="['/blog-item', blog.slug]">
                            <img [src]="blog.image" [alt]="blog.title">
                        </a>
                    </div>

                    <div class="content">
                        <span>{{blog.date}}</span>
                        <p class="category">{{blog.category}}</p>
                        <h3>
                            <a [routerLink]="['/blog-item', blog.slug]">
                                {{blog.title}}
                            </a>
                        </h3>
                        <a [routerLink]="['/blog-item', blog.slug]" class="read-more">Read More</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
